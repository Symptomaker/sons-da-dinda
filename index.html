<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sons da Live da Dinda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap">
<style>
  :root {
    --areia: #f6dc93; --laranja: #f7a51c; --laranja-esc: #d9820a; --creme: #fdf7e6;
    --azul: #49b3dc; --azul-esc: #2e8fb8; --tinta: #8a5a12; --marrom: #6b4208;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100vh; padding: 24px 16px 40px; font-family: 'Bree Serif', Georgia, serif; color: var(--tinta);
    background: var(--areia) url(areia.webp) repeat; background-size: 840px auto; background-attachment: fixed;
    overflow-x: hidden;
  }
  .fundo { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; pointer-events: none; }
  .deco { position: fixed; pointer-events: none; z-index: 0; line-height: 1; filter: drop-shadow(1px 2px 1px rgba(120, 80, 10, .35)); }
  .deco svg { display: block; }
  .chinelos { width: 12cm; height: auto; left: -1cm; top: 11cm; transform: rotate(-14deg); filter: drop-shadow(4px 8px 6px rgba(80, 50, 10, .35)); }
  .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
  .titulo {
    display: block; width: fit-content; max-width: 100%; margin: 0 auto 34px; padding: 6px 28px;
    font: 400 clamp(20px, 3.4vw, 30px) 'Bree Serif', Georgia, serif; color: #fff; text-align: center;
    background: var(--laranja); border-radius: 999px; box-shadow: 0 3px 0 var(--laranja-esc); text-shadow: 1px 1px 0 var(--laranja-esc);
  }
  .painel {
    background: rgba(253, 247, 230, .72); border: 6px solid var(--laranja); border-radius: 14px;
    box-shadow: 0 4px 0 var(--laranja-esc), 0 10px 22px rgba(120, 80, 10, .2); padding: 18px 14px 16px; position: relative;
  }
  .etiqueta {
    display: block; width: fit-content; margin: -36px auto 14px; padding: 6px 26px; border-radius: 999px;
    background: var(--laranja); color: #fff; font-size: clamp(18px, 3vw, 24px); letter-spacing: .5px;
    box-shadow: 0 3px 0 var(--laranja-esc); text-shadow: 1px 1px 0 var(--laranja-esc);
  }
  .etiqueta.azul { background: var(--azul); box-shadow: 0 3px 0 var(--azul-esc); text-shadow: 1px 1px 0 var(--azul-esc); }
  .painel + .painel { margin-top: 40px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .vazio { grid-column: 1 / -1; text-align: center; opacity: .7; margin: 0; }
  .som {
    position: relative; padding: 9px 6px; border: 0; border-radius: 10px; width: 100%; min-height: 42px;
    background: var(--creme); box-shadow: 0 2px 0 #e6d7ad, 0 4px 8px rgba(120, 80, 10, .12);
    font: 400 17px 'Bree Serif', Georgia, serif; color: var(--tinta); cursor: pointer; text-align: center;
    overflow-wrap: normal; word-break: normal;
  }
  .som:hover { background: #fff; }
  .som:active { transform: translateY(2px); box-shadow: 0 1px 0 #e6d7ad; }
  .novo .som { background: var(--azul); color: #fff; box-shadow: 0 3px 0 var(--azul-esc), 0 4px 8px rgba(20, 80, 110, .2); }
  .novo .som:hover { background: #5cc0e6; }
  .som-label { display: block; padding: 2px 8px; white-space: nowrap; overflow-wrap: normal; font-size: clamp(13px, 1vw, 16px); }
  .som-label.longa { font-size: 13px; letter-spacing: -.2px; }
  .som-control {
    position: absolute; top: -8px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff4df;
    color: #fff; font: 700 16px Arial, sans-serif; cursor: pointer; line-height: 18px; padding: 0; z-index: 1;
  }
  .apagar { right: -8px; background: #d33; }
  .mover { left: -8px; background: #198754; }
  #editor { margin: 22px auto 8px; max-width: 760px; padding: 14px; background: rgba(253, 247, 230, .82); border: 2px solid var(--laranja-esc); border-radius: 12px; }
  #recoveryBox { margin: 22px auto; max-width: 560px; padding: 18px; background: rgba(253, 247, 230, .95); border: 3px solid var(--laranja); border-radius: 12px; box-shadow: 0 4px 0 var(--laranja-esc); }
  #recoveryBox h2, #recoveryBox p { text-align: center; margin: 6px 0 12px; }
  #recoveryForm input { flex: 1 1 100%; max-width: none; }
  #conta, form { display: flex; gap: 8px; justify-content: center; align-items: center; margin: 12px 0 8px; flex-wrap: wrap; }
  input, select {
    padding: 10px 12px; font: 400 17px 'Bree Serif', Georgia, serif;
    border: 3px solid var(--laranja); border-radius: 10px; background: var(--creme); color: var(--tinta);
  }
  input { flex: 1 1 220px; max-width: 320px; min-width: 0; }
  button.add {
    padding: 10px 20px; font: 400 18px 'Bree Serif', Georgia, serif; color: #fff; cursor: pointer;
    background: #ff5fa2; border: 0; border-radius: 999px; box-shadow: 0 3px 0 #c2337a;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .secundario { padding: 8px 12px; border: 1px solid #7d4a24; border-radius: 8px; background: #fff4df; color: var(--tinta); font: 400 15px 'Bree Serif', Georgia, serif; cursor: pointer; }
  #aviso { text-align: center; min-height: 1.4em; margin: 8px 0 0; color: var(--marrom); }
  #status { text-align: center; margin: 14px 0 0; }
  .rodape { text-align: center; margin: 12px 0 0; }
  .link { background: none; border: 0; padding: 4px; font: 400 14px 'Bree Serif', Georgia, serif; color: var(--marrom); opacity: .8; text-decoration: underline; cursor: pointer; }
  @media (max-width: 640px) {
    .deco.grande { display: none; }
    .grade { grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 8px; }
    .painel { padding: 18px 10px 12px; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="estrela" viewBox="0 0 100 100"><path d="M50 4c5 0 8 22 12 30s27 4 29 9-18 15-21 24 9 26 5 30-21-10-25-10-21 14-25 10 8-21 5-30S7 48 9 43s25-1 29-9S45 4 50 4z" fill="#f59b4c" stroke="#d9732a" stroke-width="3"/><g fill="#ffd2a6"><circle cx="50" cy="22" r="2.5"/><circle cx="50" cy="34" r="2.5"/><circle cx="76" cy="44" r="2.5"/><circle cx="24" cy="44" r="2.5"/><circle cx="64" cy="76" r="2.5"/><circle cx="36" cy="76" r="2.5"/></g></symbol>
    <symbol id="concha" viewBox="0 0 100 90"><path d="M50 86 12 46C4 30 20 6 50 6s46 24 38 40z" fill="#fcd25c" stroke="#e0a526" stroke-width="3"/><g stroke="#e0a526" stroke-width="3" fill="none"><path d="M50 86V8M50 86 27 12M50 86 73 12M50 86 13 30M50 86 87 30"/></g><path d="M40 86h20l-4 4H44z" fill="#e0a526"/></symbol>
  </defs>
</svg>
<video class="fundo" src="fundo.mp4" poster="fundo.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
<img class="deco grande chinelos" src="chinelos-41-42.webp" alt="" width="848" height="983">
<span class="deco" style="right:28px;top:28px"><svg width="40" height="36"><use href="#concha"/></svg></span>
<span class="deco grande" style="right:40px;top:150px;transform:rotate(18deg)"><svg width="54" height="54"><use href="#estrela"/></svg></span>
<span class="deco" style="right:14px;bottom:14px;transform:rotate(-20deg)"><svg width="46" height="46"><use href="#estrela"/></svg></span>
<span class="deco grande" style="left:46%;bottom:8px;transform:rotate(8deg)"><svg width="34" height="30"><use href="#concha"/></svg></span>

<div class="wrap">
  <section id="recoveryBox" hidden>
    <h2>Definir nova senha mestra</h2>
    <p>Digite e confirme a nova senha. Ela precisa ter pelo menos 8 caracteres.</p>
    <form id="recoveryForm">
      <input id="recoveryPassword" type="password" placeholder="Nova senha" autocomplete="new-password" minlength="8" required aria-label="Nova senha">
      <input id="recoveryPasswordConfirm" type="password" placeholder="Confirme a nova senha" autocomplete="new-password" minlength="8" required aria-label="Confirme a nova senha">
      <button class="add" type="submit">Salvar nova senha</button>
    </form>
  </section>
  <h1 class="titulo">Sons da live da Dinda</h1>
  <section class="painel">
    <h2 class="etiqueta azul">Novos sons</h2>
    <div class="grade novo" id="novos"></div>
  </section>
  <section class="painel">
    <h2 class="etiqueta">Sons da live da Dinda</h2>
    <div class="grade" id="sons"><p class="vazio">Carregando…</p></div>
  </section>
  <section id="editor" hidden>
    <div id="conta"><span id="usuario">Edição liberada nesta sessão</span><button class="secundario" id="sair" type="button">Encerrar edição</button></div>
    <form id="form">
      <input id="cmd" placeholder="novo comando, ex: !bomdia" autocomplete="off" required maxlength="30" aria-label="Novo comando">
      <select id="secao" aria-label="Seção"><option value="novos">em Novos sons</option><option value="live">em Sons da live da Dinda</option></select>
      <button class="add" id="adicionar" type="submit">Adicionar</button>
    </form>
  </section>
  <p id="status">Conectando ao Supabase…</p>
  <p id="aviso" role="status"></p>
  <p class="rodape"><button id="entrar" class="link" type="button">Editar sons</button></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// O GitHub Pages hospeda esta página estática; a lista e a autenticação ficam no Supabase.
const SUPABASE_URL = "https://hgvsltbmhoxvlogqrstl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_MYWVy2tcROpQE_FXoXELdg_v7R8LQgC";
const EDITOR_EMAIL = "yneto88@gmail.com";

const SONS_INICIAIS = `10mil abafa calar elevoltou big eunaoaceito exacly meautosabotei morreu naovainao seliga surto
uiquedelicia verdade voupracasa euadoro elanaovemmais sugardaddy apagaisso partiuaglomerar trindom pagode
peixe calma orianna taric vayne pediu socorro naodoeu mentira bixa tira doendo desumano pau explodir queodio
voucagar barraco pintam milreais pix naotenho dois queen fimdomundo mulher perae fazendomerda eladisseisso
grito ai gogogo ahh gemidao morra rezando eoutra ahri coco para vemca starmie peidao euquero mami meperdoa
sumir oxente vergonha balao fogo scat chanel tratando limpatudo alivia gata mendiga violento possofalar
loira autoestima`.split(/\s+/);
const NOVOS_INICIAIS = `ajoelhar vagabunda eai carreira orar ganhou sotemgay parabens buceta aplausos gemido meusqueridos fodase`.split(/\s+/);
const $ = id => document.getElementById(id);
const aviso = texto => $('aviso').textContent = texto;
let sbClient = null, sonsLista = [], usuarioAtual = null, podeEditar = false, listaEditavel = false, modoRecuperacao = false;

function itensLocais() {
  return [...SONS_INICIAIS.map((nome, i) => ({nome, secao:'live', ordem:i + 1})),
    ...NOVOS_INICIAIS.map((nome, i) => ({nome, secao:'novos', ordem:i + 1}))];
}
function copiarSom(nome) {
  navigator.clipboard.writeText('!' + nome).then(() => aviso(`!${nome} copiado`), () => aviso('Não foi possível copiar. Verifique a permissão do navegador.'));
}
function botao(item) {
  const b = document.createElement('div');
  b.className = 'som'; b.setAttribute('role', 'button'); b.tabIndex = 0; b.title = 'Clique para copiar';
  const label = document.createElement('span');
  label.className = 'som-label' + (item.nome.length >= 13 ? ' longa' : '');
  label.textContent = '!' + item.nome; b.append(label);
  b.onclick = e => { if (!e.target.closest('.som-control')) copiarSom(item.nome); };
  b.onkeydown = e => { if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); copiarSom(item.nome); } };
  if (podeEditar && listaEditavel) {
    const destino = item.secao === 'live' ? 'novos' : 'live';
    const destinoLabel = destino === 'live' ? 'Sons da live da Dinda' : 'Novos sons';
    const mover = document.createElement('button');
    mover.className = 'som-control mover'; mover.type = 'button'; mover.textContent = destino === 'novos' ? '→' : '←';
    mover.title = `Mover !${item.nome} para ${destinoLabel}`; mover.setAttribute('aria-label', mover.title);
    mover.onclick = async e => {
      e.stopPropagation();
      const ordem = Math.max(0, ...sonsLista.filter(s => s.secao === destino).map(s => Number(s.ordem) || 0)) + 1;
      const {error} = await sbClient.from('sons_lista').update({secao:destino, ordem}).eq('nome', item.nome);
      if (error) return aviso('Erro ao mover som: ' + error.message);
      aviso(`!${item.nome} movido para ${destinoLabel}.`); await carregarSons();
    };
    const apagar = document.createElement('button');
    apagar.className = 'som-control apagar'; apagar.type = 'button'; apagar.textContent = '×';
    apagar.title = `Remover !${item.nome}`; apagar.setAttribute('aria-label', apagar.title);
    apagar.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Remover !${item.nome} da lista compartilhada?`)) return;
      const {error} = await sbClient.from('sons_lista').delete().eq('nome', item.nome);
      if (error) return aviso('Erro ao remover som: ' + error.message);
      aviso(`!${item.nome} removido.`); await carregarSons();
    };
    b.append(mover, apagar);
  }
  return b;
}
function render() {
  const itens = listaEditavel ? sonsLista : (sonsLista.length ? sonsLista : itensLocais());
  const aoVivo = itens.filter(x => x.secao === 'live').sort((a,b) => a.ordem - b.ordem);
  const novos = itens.filter(x => x.secao === 'novos').sort((a,b) => a.ordem - b.ordem);
  const botoesLive = aoVivo.map(botao), botoesNovos = novos.map(botao);
  if (!botoesLive.length) botoesLive.push(Object.assign(document.createElement('p'), {className:'vazio', textContent:'Nenhum som aqui ainda'}));
  if (!botoesNovos.length) botoesNovos.push(Object.assign(document.createElement('p'), {className:'vazio', textContent:'Nenhum som aqui ainda'}));
  $('sons').replaceChildren(...botoesLive); $('novos').replaceChildren(...botoesNovos);
  $('editor').hidden = modoRecuperacao || !(podeEditar && listaEditavel);
  $('entrar').hidden = modoRecuperacao || !!podeEditar;
  $('recoveryBox').hidden = !modoRecuperacao;
  $('adicionar').disabled = !listaEditavel;
}
async function carregarSons() {
  const {data,error} = await sbClient.from('sons_lista').select('nome,secao,ordem').order('secao').order('ordem', {ascending:true});
  if (!error) {
    sonsLista = data || []; listaEditavel = true; render(); $('status').textContent = 'Lista sincronizada.'; return;
  }
  const legacy = await sbClient.from('sons_extras').select('nome').order('criado_em', {ascending:true});
  if (legacy.error) {
    sonsLista = itensLocais(); listaEditavel = false; render();
    $('status').textContent = 'Não foi possível carregar a lista compartilhada.'; console.error(error, legacy.error); return;
  }
  sonsLista = [...itensLocais(), ...(legacy.data || []).map((x,i) => ({nome:x.nome,secao:'novos',ordem:10000+i}))];
  listaEditavel = false; render(); $('status').textContent = 'Lista visível. Falta atualizar o banco para editar os sons.';
}
async function atualizarSessao() {
  const {data} = await sbClient.auth.getSession(); usuarioAtual = data.session?.user || null; podeEditar = false;
  if (usuarioAtual) { const {data: autorizado,error} = await sbClient.rpc('pode_editar_sons'); podeEditar = !error && autorizado === true; }
  render();
  if (usuarioAtual && !podeEditar) aviso('Esta conta ainda não está autorizada a editar.');
  else if (usuarioAtual && !listaEditavel) aviso('Atualize o banco de dados para habilitar a edição da lista.');
}
async function iniciar() {
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:false, autoRefreshToken:true, detectSessionInUrl:true}});
  sbClient.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      modoRecuperacao = true; render();
      $('status').textContent = 'Link de recuperação confirmado. Defina sua nova senha abaixo.';
      window.scrollTo({top:0, behavior:'smooth'});
      return;
    }
    if (['SIGNED_IN','SIGNED_OUT','INITIAL_SESSION','TOKEN_REFRESHED','USER_UPDATED'].includes(event)) {
      setTimeout(async () => { await atualizarSessao(); await carregarSons(); }, 0);
    }
  });
  await atualizarSessao(); await carregarSons();
  sbClient.channel('sons-compartilhados').on('postgres_changes', {event:'*',schema:'public',table:'sons_lista'}, carregarSons).subscribe();
}
$('entrar').onclick = async () => {
  const senha = prompt('Digite a senha mestra para editar os sons:');
  if (senha === null || !senha) return;
  const {error} = await sbClient.auth.signInWithPassword({email:EDITOR_EMAIL, password:senha});
  if (error) return aviso('Senha mestra inválida ou serviço indisponível.');
  aviso('Edição liberada.');
};
$('sair').onclick = async () => { await sbClient.auth.signOut(); aviso('Você saiu da conta.'); };
$('recoveryForm').onsubmit = async e => {
  e.preventDefault();
  const nova = $('recoveryPassword').value;
  const confirmacao = $('recoveryPasswordConfirm').value;
  if (nova.length < 8) return aviso('A nova senha precisa ter pelo menos 8 caracteres.');
  if (nova !== confirmacao) return aviso('As senhas novas não conferem.');
  const {error} = await sbClient.auth.updateUser({password:nova});
  if (error) return aviso('Não foi possível redefinir a senha: ' + error.message);
  modoRecuperacao = false;
  $('recoveryPassword').value = ''; $('recoveryPasswordConfirm').value = '';
  history.replaceState(null, '', location.pathname + location.search);
  await sbClient.auth.signOut();
  render();
  $('status').textContent = 'Senha redefinida com sucesso. Entre usando a nova senha.';
  aviso('Senha mestra redefinida.');
};
$('form').onsubmit = async e => {
  e.preventDefault();
  if (!podeEditar) return aviso('Você não tem permissão para adicionar sons.');
  if (!listaEditavel) return aviso('Atualize o banco de dados antes de editar a lista.');
  const nome = $('cmd').value.trim().toLowerCase().replace(/^!+/, '').replace(/\s+/g, '');
  if (!/^[a-z0-9_áàâãéèêíìîóòôõúùûç]+$/i.test(nome)) return aviso('Use apenas letras, números e underline.');
  if (sonsLista.some(x => x.nome === nome)) return aviso(`!${nome} já existe.`);
  const secao = $('secao').value;
  const ordem = Math.max(0, ...sonsLista.filter(x => x.secao === secao).map(x => Number(x.ordem) || 0)) + 1;
  const {error} = await sbClient.from('sons_lista').insert({nome, secao, ordem});
  if (error) return aviso(error.code === '23505' ? `!${nome} já existe.` : 'Erro ao adicionar: ' + error.message);
  $('cmd').value = ''; aviso(`!${nome} adicionado à lista compartilhada.`); await carregarSons();
};
if (matchMedia('(prefers-reduced-motion: reduce)').matches) document.querySelector('.fundo').pause();
iniciar();
</script>
</body>
</html>

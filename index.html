<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sons da Live da Dinda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Fredoka:wght@600&display=swap">
<style>
:root{--wood:#f3c98b;--wood-dark:#c98b45;--ink:#3b2412;--yellow:#ffe14d;--pink:#ff5fa2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:16px;font-family:Fredoka,sans-serif;color:var(--ink);background:linear-gradient(100deg,transparent 88%,#7fd3e8 92%,#2bb5d6 100%),radial-gradient(circle at 20% 30%,#fbe7c0,#f1d39a 70%)}
.wrap{max-width:1200px;margin:0 auto}
.placa{display:block;width:fit-content;margin:8px auto 20px;padding:10px 32px;background:linear-gradient(#a8693a,#7d4a24);border:4px solid #5e3416;border-radius:14px;font:400 clamp(26px,5vw,56px) 'Luckiest Guy',cursive;color:#fff6e0;text-shadow:3px 3px 0 #5e3416;box-shadow:0 6px 0 #5e3416;text-align:center}
.placa span{color:var(--pink);text-shadow:3px 3px 0 #fff,5px 5px 0 #5e3416}
.placa.novos{color:var(--yellow)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.som{position:relative;padding:8px 6px;border:2px solid var(--wood-dark);border-radius:8px;background:linear-gradient(#f8d9a6,var(--wood));box-shadow:0 3px 0 var(--wood-dark);font:600 17px Fredoka,sans-serif;color:var(--ink);cursor:pointer;text-align:center;overflow-wrap:normal;word-break:normal;min-height:42px}
.som:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}
.novo .som{background:linear-gradient(#fff07a,var(--yellow));border-color:#d1a900;box-shadow:0 3px 0 #d1a900}
.som-label{display:block;padding:2px 8px;white-space:nowrap;overflow-wrap:normal;font-size:clamp(13px,1vw,16px)}
.som-label.longa{font-size:13px;letter-spacing:-.2px}
.som-control{position:absolute;top:-8px;width:24px;height:24px;border-radius:50%;border:2px solid #fff4df;color:#fff;font-size:16px;font-weight:700;cursor:pointer;line-height:18px;padding:0;z-index:1}
.apagar{right:-8px;background:#d33}
.mover{left:-8px;background:#198754}
#editor{margin:22px auto 8px;max-width:720px;padding:14px;background:#fff4dfb8;border:2px solid var(--wood-dark);border-radius:12px}
#form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;padding:10px 12px;font:600 17px Fredoka,sans-serif;border:2px solid var(--wood-dark);border-radius:8px;background:#fffaf0}
button.add{padding:10px 18px;font:400 20px 'Luckiest Guy',cursive;color:#fff;cursor:pointer;background:var(--pink);border:2px solid #c2337a;border-radius:8px;box-shadow:0 3px 0 #c2337a}
button:disabled{opacity:.55;cursor:not-allowed}
#aviso{text-align:center;min-height:1.4em;margin:10px 0 0}
#conta{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0}
#loginBox{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.secundario{padding:8px 12px;border:1px solid #7d4a24;border-radius:8px;background:#fff4df;color:var(--ink);font:600 15px Fredoka;cursor:pointer}
#status{font-size:14px;text-align:center;min-height:1.2em}
.escondido{display:none!important}
@media(max-width:480px){body{padding:10px}.placa{padding:9px 18px}.grade{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="placa">Sons da live da <span>Dinda</span></h1>
  <div class="grade" id="sons"></div>
  <h2 class="placa novos">Novos sons</h2>
  <div class="grade novo" id="novos"></div>

  <section id="editor" class="escondido">
    <div id="conta">
      <span id="usuario"></span>
      <button class="secundario" id="sair" type="button">Encerrar edição</button>
    </div>
    <form id="form">
      <input id="cmd" placeholder="novo comando, ex: !bomdia" autocomplete="off" required maxlength="30" aria-label="Novo comando">
      <button class="add" id="adicionar" type="submit">Adicionar</button>
    </form>
  </section>

  <div id="loginBox">
    <button class="secundario" id="entrar" type="button">Editar sons</button>
  </div>
  <p id="status">Carregando sons...</p>
  <p id="aviso" role="status"></p>
</div>

<!-- Configure a URL e a chave anon/public do seu projeto Supabase aqui. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hgvsltbmhoxvlogqrstl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_MYWVy2tcROpQE_FXoXELdg_v7R8LQgC";
// Conta interna compartilhada. A senha mestra nunca fica salva no código do site.
const EDITOR_EMAIL = "sons-da-dinda-editor@example.com";

const SONS_INICIAIS = `10mil abafa calar elevoltou big eunaoaceito exacly meautosabotei morreu naovainao seliga surto
uiquedelicia verdade voupracasa euadoro elanaovemmais sugardaddy apagaisso partiuaglomerar trindom pagode
peixe calma orianna taric vayne pediu socorro naodoeu mentira bixa tira doendo desumano pau explodir queodio
voucagar barraco pintam milreais pix naotenho dois queen fimdomundo mulher perae fazendomerda eladisseisso
grito ai gogogo ahh gemidao morra rezando eoutra ahri coco para vemca starmie peidao euquero mami meperdoa
sumir oxente vergonha balao fogo scat chanel tratando limpatudo alivia gata mendiga violento possofalar
loira autoestima`.split(/\s+/);
const NOVOS_INICIAIS = `ajoelhar vagabunda eai carreira orar ganhou sotemgay parabens buceta aplausos gemido meusqueridos fodase`.split(/\s+/);

const $ = id => document.getElementById(id);
const aviso = t => $('aviso').textContent = t;
let sbClient = null, sonsLista = [], usuarioAtual = null, podeEditar = false, listaEditavel = false;

function itensLocais() {
  return [
    ...SONS_INICIAIS.map((nome, i) => ({nome, secao:'live', ordem:i + 1})),
    ...NOVOS_INICIAIS.map((nome, i) => ({nome, secao:'novos', ordem:i + 1}))
  ];
}

function copiarSom(nome) {
  navigator.clipboard.writeText('!' + nome)
    .then(() => aviso(`!${nome} copiado`))
    .catch(() => aviso('Não foi possível copiar. Verifique a permissão do navegador.'));
}

function botao(item) {
  const b = document.createElement('div');
  b.className = 'som'; b.setAttribute('role', 'button'); b.tabIndex = 0;
  b.title = 'Clique para copiar';
  const label = document.createElement('span');
  label.className = 'som-label' + (item.nome.length >= 13 ? ' longa' : '');
  label.textContent = '!' + item.nome;
  b.append(label);
  b.onclick = e => { if (!e.target.closest('.som-control')) copiarSom(item.nome); };
  b.onkeydown = e => {
    if (e.target === b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); copiarSom(item.nome); }
  };

  if (podeEditar && listaEditavel) {
    const mover = document.createElement('button');
    const destino = item.secao === 'live' ? 'novos' : 'live';
    mover.className = 'som-control mover'; mover.type = 'button'; mover.textContent = destino === 'novos' ? '→' : '←';
    const destinoLabel = destino === 'live' ? 'Sons da live da Dinda' : 'Novos sons';
    mover.title = `Mover !${item.nome} para ${destinoLabel}`;
    mover.setAttribute('aria-label', mover.title);
    mover.onclick = async e => {
      e.stopPropagation();
      const ordem = Math.max(0, ...sonsLista.filter(s => s.secao === destino).map(s => Number(s.ordem) || 0)) + 1;
      const {error} = await sbClient.from('sons_lista').update({secao:destino, ordem}).eq('nome', item.nome);
      if (error) return aviso('Erro ao mover som: ' + error.message);
      aviso(`!${item.nome} movido para ${destinoLabel}.`); await carregarSons();
    };

    const apagar = document.createElement('button');
    apagar.className = 'som-control apagar'; apagar.type = 'button'; apagar.textContent = '×';
    apagar.title = `Remover !${item.nome}`;
    apagar.setAttribute('aria-label', apagar.title);
    apagar.onclick = async e => {
      e.stopPropagation();
      if (!confirm(`Remover !${item.nome} da lista compartilhada?`)) return;
      const {error} = await sbClient.from('sons_lista').delete().eq('nome', item.nome);
      if (error) return aviso('Erro ao remover som: ' + error.message);
      aviso(`!${item.nome} removido.`); await carregarSons();
    };
    b.append(mover, apagar);
  }
  return b;
}

function render() {
  const itens = sonsLista.length ? sonsLista : itensLocais();
  const aoVivo = itens.filter(x => x.secao === 'live').sort((a,b) => a.ordem - b.ordem);
  const novos = itens.filter(x => x.secao === 'novos').sort((a,b) => a.ordem - b.ordem);
  $('sons').replaceChildren(...aoVivo.map(botao));
  $('novos').replaceChildren(...novos.map(botao));
  $('editor').classList.toggle('escondido', !(podeEditar && listaEditavel));
  $('loginBox').classList.toggle('escondido', !!podeEditar);
  $('usuario').textContent = usuarioAtual ? 'Edição liberada nesta sessão' : '';
  $('adicionar').disabled = !listaEditavel;
}

async function carregarSons() {
  const {data,error} = await sbClient.from('sons_lista').select('nome,secao,ordem').order('secao').order('ordem', {ascending:true});
  if (!error) {
    sonsLista = data || [];
    listaEditavel = true;
    render();
    $('status').textContent = 'Lista sincronizada.';
    return;
  }

  // Compatibilidade durante a troca: mantém os comandos antigos visíveis até
  // que a tabela sons_lista seja criada pelo SQL de migração.
  const legacy = await sbClient.from('sons_extras').select('nome').order('criado_em', {ascending:true});
  if (legacy.error) {
    sonsLista = itensLocais();
    listaEditavel = false;
    render();
    $('status').textContent = 'Não foi possível carregar a lista compartilhada.';
    console.error(error, legacy.error);
    return;
  }
  sonsLista = [...itensLocais(), ...(legacy.data || []).map((x,i) => ({nome:x.nome,secao:'novos',ordem:10000+i}))];
  listaEditavel = false;
  render();
  $('status').textContent = 'Lista visível. Falta atualizar o banco para editar os sons.';
}

async function atualizarSessao() {
  const {data} = await sbClient.auth.getSession();
  usuarioAtual = data.session?.user || null;
  podeEditar = false;
  if (usuarioAtual) {
    const {data: autorizado, error} = await sbClient.rpc('pode_editar_sons');
    podeEditar = !error && autorizado === true;
  }
  render();
  if (usuarioAtual && !podeEditar) aviso('Esta conta ainda não está autorizada a editar.');
  else if (usuarioAtual && !listaEditavel) aviso('Atualize o banco de dados para habilitar a edição da lista.');
}

async function iniciar() {
  if (SUPABASE_URL.startsWith('COLE_AQUI') || SUPABASE_ANON_KEY.startsWith('COLE_AQUI')) {
    $('status').textContent = 'Site ainda não configurado: adicione as credenciais do Supabase no arquivo.';
    // A lista fixa continua visível mesmo antes da configuração.
    sonsLista = itensLocais(); listaEditavel = false; render();
    return;
  }
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {persistSession:false, autoRefreshToken:true, detectSessionInUrl:false}
  });
  await atualizarSessao();
  await carregarSons();
  sbClient.auth.onAuthStateChange(async () => {
    await atualizarSessao();
    await carregarSons();
  });
  // Atualização em tempo real para todos os visitantes.
  sbClient.channel('sons-compartilhados')
    .on('postgres_changes', {event:'*',schema:'public',table:'sons_lista'}, carregarSons)
    .subscribe();
}

$('entrar').onclick = async () => {
  if (!sbClient) return aviso('O serviço de edição não está configurado.');
  const senha = prompt('Digite a senha mestra para editar os sons:');
  if (senha === null || !senha) return;
  const {error} = await sbClient.auth.signInWithPassword({email:EDITOR_EMAIL, password:senha});
  if (error) return aviso('Senha mestra inválida ou serviço indisponível.');
  aviso('Edição liberada.');
};
$('sair').onclick = async () => { await sbClient.auth.signOut(); aviso('Você saiu da conta.'); };
$('form').onsubmit = async e => {
  e.preventDefault();
  if (!podeEditar) return aviso('Você não tem permissão para adicionar sons.');
  if (!listaEditavel) return aviso('Atualize o banco de dados antes de editar a lista.');
  const nome = $('cmd').value.trim().toLowerCase().replace(/^!+/, '').replace(/\s+/g, '');
  if (!/^[a-z0-9_áàâãéèêíìîóòôõúùûç]+$/i.test(nome)) return aviso('Use apenas letras, números e underline.');
  if (sonsLista.some(x => x.nome === nome)) return aviso(`!${nome} já existe.`);
  const ordem = Math.max(0, ...sonsLista.filter(x => x.secao === 'novos').map(x => Number(x.ordem) || 0)) + 1;
  const {error} = await sbClient.from('sons_lista').insert({nome, secao:'novos', ordem});
  if (error) return aviso(error.code === '23505' ? `!${nome} já existe.` : 'Erro ao adicionar: ' + error.message);
  $('cmd').value = ''; aviso(`!${nome} adicionado à lista compartilhada.`); await carregarSons();
};

iniciar();
</script>
</body>
</html>
